name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        run: |
          gradle --no-daemon :app:lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          }
      - name: Audit APK (three verification passes)
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          for pass in 1 2 3; do
            echo "APK verification pass ${pass}/3"
            unzip -tq "$APK"
            "$AAPT" dump badging "$APK" > /tmp/tessera-badging.txt
            grep -Fq "package: name='com.example.tessera.debug'" /tmp/tessera-badging.txt
            grep -Eq "^launchable-activity:" /tmp/tessera-badging.txt
            grep -Fq "sdkVersion:'26'" /tmp/tessera-badging.txt
            grep -Fq "targetSdkVersion:'36'" /tmp/tessera-badging.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK"
          done
          echo "Final APK SHA-256:"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumentation:
    name: Android 15 emulator tests
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 900
          disable-linux-hw-accel: true
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest

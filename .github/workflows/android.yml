name: Android CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Build, lint and publish debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Run Android lint
        run: |
          gradle --no-daemon :app:lintDebug || {
            cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
            exit 1
          }
      - name: Audit APK (three verification passes)
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -s "$APK"
          for pass in 1 2 3; do
            echo "APK verification pass ${pass}/3"
            unzip -tq "$APK"
            "$AAPT" dump badging "$APK" > /tmp/tessera-badging.txt
            grep -Fq "package: name='com.example.tessera.debug'" /tmp/tessera-badging.txt
            grep -Eq "^launchable-activity:" /tmp/tessera-badging.txt
            grep -Fq "sdkVersion:'26'" /tmp/tessera-badging.txt
            grep -Fq "targetSdkVersion:'36'" /tmp/tessera-badging.txt
            "$APKSIGNER" verify --verbose --print-certs "$APK" | tee /tmp/tessera-signature.txt
            grep -Fq "Signer #1 certificate SHA-256 digest: c092f80aab6af16840b2307ac7ad1e6066fb491e9178f40fe17d2b2727dcb42a" /tmp/tessera-signature.txt
          done
          echo "Final APK SHA-256:"
          sha256sum "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: tessera-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

  instrumentation:
    name: Android 15 emulator tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'
      - name: Enable KVM for hardware-accelerated emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
      - name: Run Android instrumentation tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          cores: 2
          ram-size: 2048M
          heap-size: 512M
          emulator-boot-timeout: 1200
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-linux-hw-accel: false
          disable-animations: true
          script: gradle --no-daemon :app:connectedDebugAndroidTest --stacktrace --info
      - name: Upload instrumentation test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tessera-android-15-test-reports
          path: |
            app/build/outputs/androidTest-results/connected/
            app/build/reports/androidTests/connected/
          if-no-files-found: warn
